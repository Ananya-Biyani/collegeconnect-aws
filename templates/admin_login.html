{% extends "base.html" %}

{% block title %}Administrator Login — CollegeConnect{% endblock %}

{% block content %}
<div class="container">
  <div class="form-layout-container" style="max-width: 460px;">
    <div class="form-card">
      <div class="form-header">
        <div style="width: 56px; height: 56px; border-radius: 16px; background-color: #EEF2FF; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto; color: #4F46E5;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 class="form-title">Admin Portal</h1>
        <p class="form-subtitle">Enter administrator credentials to manage college events</p>
      </div>

      <!-- Demo Dev Helper Notice -->
      <div class="alert alert-info" style="font-size: 0.85rem; padding: 0.75rem 1rem;">
        <svg class="alert-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        <div>
          <strong>Development Demo:</strong><br>
          Username: <code>admin</code><br>
          Password: <code>admin@collegeconnect2026</code>
        </div>
      </div>

      <form action="{{ url_for('admin_login', next=request.args.get('next')) }}" method="POST" data-disable-on-submit="true">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- Username -->
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input type="text"
                 id="username"
                 name="username"
                 class="form-control"
                 placeholder="Enter admin username"
                 required
                 autofocus>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password"
                 id="password"
                 name="password"
                 class="form-control"
                 placeholder="Enter admin password"
                 required>
        </div>

        <!-- Submit Button -->
        <div class="form-actions" style="margin-top: 1.5rem;">
          <button type="submit" class="btn btn-primary btn-block">
            Sign In to Dashboard &rarr;
          </button>
        </div>
      </form>

      <div style="text-align: center; margin-top: 1.5rem;">
        <a href="{{ url_for('index') }}" style="font-size: 0.85rem; color: #64748B;">
          &larr; Return to Student Portal
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
