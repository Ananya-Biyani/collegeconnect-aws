<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <defs>
    <linearGradient id="wdBg" x1="0" y1="0" x2="400" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#wdBg)"/>

  <!-- Modern Desk Workspace Setup -->
  <line x1="0" y1="160" x2="400" y2="160" stroke="#134E4A" stroke-width="4"/>

  <!-- Desktop Monitor / Screen -->
  <rect x="120" y="30" width="160" height="105" rx="6" fill="#1E293B" stroke="#2DD4BF" stroke-width="2"/>
  <rect x="128" y="38" width="144" height="89" rx="3" fill="#0F172A"/>

  <!-- Monitor stand -->
  <rect x="192" y="135" width="16" height="22" fill="#334155"/>
  <rect x="175" y="157" width="50" height="4" rx="2" fill="#475569"/>

  <!-- Web layout wireframe on screen -->
  <rect x="136" y="46" width="128" height="14" rx="2" fill="#14B8A6" opacity="0.8"/>
  <rect x="136" y="65" width="58" height="54" rx="2" fill="#2DD4BF" opacity="0.3"/>
  <rect x="200" y="65" width="64" height="14" rx="2" fill="#2DD4BF" opacity="0.5"/>
  <rect x="200" y="83" width="64" height="14" rx="2" fill="#2DD4BF" opacity="0.4"/>
  <rect x="200" y="101" width="40" height="10" rx="2" fill="#F59E0B" opacity="0.8"/>

  <!-- Potted plant on left -->
  <path d="M55,160 L50,135 L70,135 L65,160 Z" fill="#D97706"/>
  <circle cx="60" cy="125" r="14" fill="#10B981"/>
  <circle cx="50" cy="118" r="10" fill="#34D399"/>
  <circle cx="70" cy="118" r="10" fill="#059669"/>

  <!-- Coffee cup on right -->
  <rect x="325" y="130" width="22" height="30" rx="3" fill="#F8FAFC"/>
  <path d="M347,138 C354,138 354,148 347,148" stroke="#F8FAFC" stroke-width="3" fill="none"/>
  <!-- Steam lines -->
  <path d="M331,124 Q334,116 331,110" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M339,122 Q342,114 339,108" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <text x="200" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#CCFBF1" text-anchor="middle" letter-spacing="1">WEB DEV WORKSHOP</text>
</svg>

