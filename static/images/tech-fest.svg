<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <defs>
    <linearGradient id="tfBg" x1="0" y1="0" x2="400" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#tfBg)"/>
  
  <!-- Cyber grid -->
  <line x1="0" y1="40" x2="400" y2="40" stroke="#38BDF8" stroke-width="0.5" opacity="0.25"/>
  <line x1="0" y1="80" x2="400" y2="80" stroke="#38BDF8" stroke-width="0.5" opacity="0.25"/>
  <line x1="0" y1="120" x2="400" y2="120" stroke="#38BDF8" stroke-width="0.5" opacity="0.25"/>
  <line x1="0" y1="160" x2="400" y2="160" stroke="#38BDF8" stroke-width="0.5" opacity="0.25"/>

  <line x1="80" y1="0" x2="80" y2="200" stroke="#38BDF8" stroke-width="0.5" opacity="0.2"/>
  <line x1="160" y1="0" x2="160" y2="200" stroke="#38BDF8" stroke-width="0.5" opacity="0.2"/>
  <line x1="240" y1="0" x2="240" y2="200" stroke="#38BDF8" stroke-width="0.5" opacity="0.2"/>
  <line x1="320" y1="0" x2="320" y2="200" stroke="#38BDF8" stroke-width="0.5" opacity="0.2"/>

  <!-- Futuristic hexagon / portal glow -->
  <circle cx="200" cy="100" r="65" stroke="url(#neonCyan)" stroke-width="2" stroke-dasharray="8 6" opacity="0.8"/>
  <circle cx="200" cy="100" r="75" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 8" opacity="0.5"/>

  <!-- Tech Fest Typography -->
  <text x="200" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">TECH FEST</text>
  <text x="200" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#BAE6FD" text-anchor="middle" letter-spacing="4">INNOVATE • BUILD • CONNECT</text>

  <!-- Glowing dots -->
  <circle cx="60" cy="50" r="3" fill="#38BDF8"/>
  <line x1="60" y1="50" x2="90" y2="50" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="90" cy="50" r="2" fill="#BAE6FD"/>
  <circle cx="340" cy="150" r="3" fill="#38BDF8"/>
  <line x1="310" y1="150" x2="340" y2="150" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="310" cy="150" r="2" fill="#BAE6FD"/>
</svg>

